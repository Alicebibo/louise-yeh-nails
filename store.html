<style>
:root{
  --bg:#f7f5f1; --paper:#fefdfb; --ink:#2e2925; --muted:#8a8078; --line:#e6e0d8;
  --rose:#b5a184; --rose-deep:#7a6652; --rose-soft:#efebe5; --pearl:#faf8f5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:grab;touch-action:none}
#scene.hover{cursor:pointer}
#scene:active{cursor:grabbing}
.top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;pointer-events:none;z-index:5}
.brand{display:flex;align-items:center;gap:12px;pointer-events:auto;text-decoration:none;color:inherit;background:rgba(254,253,251,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:6px 18px 6px 8px;box-shadow:0 8px 24px -16px rgba(70,62,54,.5)}
.brand img{height:40px;width:auto}
.brand b{font-family:"Noto Serif TC",serif;font-weight:700;font-size:15px;letter-spacing:.08em;display:block;line-height:1.2}
.brand i{font-family:"Bodoni Moda",serif;font-size:13px;color:var(--rose-deep);display:block;line-height:1.2}
.back{pointer-events:auto;font-size:13px;letter-spacing:.12em;color:var(--rose-deep);text-decoration:none;background:rgba(254,253,251,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:10px 18px;white-space:nowrap}
.back:hover{background:var(--paper)}
.nav{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;background:rgba(254,253,251,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:999px;box-shadow:0 14px 30px -18px rgba(70,62,54,.55);z-index:5;max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{font:inherit;font-size:14px;letter-spacing:.1em;border:0;background:transparent;color:var(--ink);padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.25s}
.nav button .en{font-family:"Bodoni Moda",serif;font-style:italic;font-size:12px;color:var(--muted);margin-left:6px;letter-spacing:0}
.nav button:hover{background:var(--rose-soft)}
.nav button[aria-pressed="true"]{background:var(--rose-deep);color:#fff}
.nav button[aria-pressed="true"] .en{color:rgba(255,255,255,.75)}
.nav button.enter{background:linear-gradient(135deg,#c9ab7a,#a8895c);color:#fff}
.nav button.enter .en{color:rgba(255,255,255,.8)}
.hint{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);font-size:12px;letter-spacing:.14em;color:var(--muted);background:rgba(254,253,251,.7);padding:6px 14px;border-radius:999px;z-index:4;white-space:nowrap;transition:opacity .6s;pointer-events:none}
.hint.off{opacity:0}
/* 店門上的「點我進店」標籤 */
.doortag{text-decoration:none;position:fixed;left:0;top:0;transform:translate(-50%,-100%);z-index:4;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:opacity .4s}
.doortag span{font-size:13px;letter-spacing:.16em;color:#fff;background:linear-gradient(135deg,#c9ab7a,#a8895c);padding:8px 16px;border-radius:999px;box-shadow:0 10px 22px -10px rgba(120,90,50,.7);white-space:nowrap}
.doortag em{font-family:"Bodoni Moda",serif;font-size:12px;color:#fff;opacity:.85;margin-left:6px}
.doortag i{width:1px;height:40px;background:linear-gradient(#c9ab7a,transparent)}
.doortag{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{margin-top:-6px}}
.doortag.off{opacity:0;pointer-events:none}
/* detail panel */
.panel{position:fixed;top:0;right:0;height:100%;width:min(400px,92vw);background:var(--paper);border-left:1px solid var(--line);box-shadow:-20px 0 50px -30px rgba(70,62,54,.5);transform:translateX(105%);transition:transform .55s cubic-bezier(.2,.9,.3,1);z-index:8;display:flex;flex-direction:column;overflow:auto}
.panel.open{transform:none}
.panel .ph{background:var(--pearl);padding:28px 28px 0}
.panel .ph img{width:100%;display:block;border-radius:6px;box-shadow:0 14px 30px -18px rgba(70,62,54,.5)}
.panel .bd{padding:24px 30px 34px}
.panel .no{font-family:"Bodoni Moda",serif;font-size:13px;letter-spacing:.2em;color:var(--rose-deep)}
.panel h2{font-family:"Noto Serif TC",serif;font-weight:700;font-size:26px;line-height:1.3;margin-top:8px}
.panel .en{font-family:"Bodoni Moda",serif;font-style:italic;font-size:17px;color:var(--muted);margin-top:4px}
.panel .media{font-size:13px;letter-spacing:.12em;color:var(--muted);margin-top:14px}
.panel p{font-size:15px;line-height:1.9;margin-top:16px;color:#4a423c}
.panel ul{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.panel li{font-size:13px;border:1px solid var(--line);background:var(--pearl);color:var(--rose-deep);padding:5px 12px;border-radius:999px}
.panel .go{display:inline-block;margin-top:24px;font-size:14px;letter-spacing:.14em;color:#fff;background:var(--rose-deep);padding:11px 22px;border-radius:999px;text-decoration:none}
.panel .x{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(254,253,251,.9);font-size:20px;line-height:1;color:var(--ink);cursor:pointer}

.panel .ph img{cursor:zoom-in}
.zoomhint{display:block;text-align:center;font-size:12px;letter-spacing:.14em;color:var(--muted);margin-top:10px}
.lightbox{position:fixed;inset:0;z-index:30;background:rgba(30,26,22,.92);display:none;align-items:center;justify-content:center;cursor:zoom-out;touch-action:pinch-zoom}
.lightbox.on{display:flex}
.lightbox img{max-width:96vw;max-height:92vh;object-fit:contain;border-radius:4px;box-shadow:0 30px 80px -30px #000}
.lightbox .x{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font-size:24px;cursor:pointer}
body.panel-open .doortag{opacity:0;pointer-events:none}
.fade{position:fixed;inset:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .7s;z-index:15}
.fade.on{opacity:1}
.loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);z-index:20;transition:opacity .8s}
.loader.done{opacity:0;pointer-events:none}
.loader img{height:150px;animation:breathe 2.4s ease-in-out infinite}
.loader .bar{width:180px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.loader .bar i{display:block;height:100%;width:0;background:var(--rose);transition:width .3s}
.loader span{font-size:12px;letter-spacing:.3em;color:var(--muted)}
@keyframes breathe{50%{transform:scale(1.04);opacity:.85}}
.err{display:none;position:fixed;inset:0;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:21;background:var(--bg);font-size:15px;line-height:1.9}
@media (max-width:640px){
  .top{padding:12px 16px}
  .brand{padding:4px 14px 4px 6px}
  .brand img{height:32px}
  .brand b{font-size:13px}
  .brand i{display:none}
  .back{padding:8px 14px;font-size:12px}
  .nav{bottom:14px}
  .nav button{padding:8px 12px;font-size:13px}
  .nav button .en{display:none}
  .hint{bottom:70px;font-size:11px}
  .panel{top:auto;bottom:0;height:auto;max-height:82vh;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(105%)}
  .panel .ph{padding:20px 20px 0;display:flex;flex-direction:column;align-items:center}
  .panel .ph img{width:auto;max-width:100%;max-height:36vh}
  .panel .bd{padding:18px 22px 28px}
  .panel h2{font-size:22px}
}
@media (prefers-reduced-motion:reduce){.loader img,.doortag{animation:none}}
</style>
</head>

<canvas id="scene" aria-label="LuLu’s Handmade 3D 小店外觀"></canvas>

  <a class="brand" href="index.html"><img src="logo/emblem.png" alt=""><span><b>LuLu’s Handmade</b><i>3D Showroom</i></span></a>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

async function loadWorks(){
  const html = await (await fetch('index.html', {cache:'no-cache'})).text();
  const grab = name => { const m = html.match(new RegExp('const ' + name + ' = (\\[[\\s\\S]*?\\n\\]);')); return m ? new Function('return ' + m[1])() : []; };
  return { nails: grab('NAILS'), acc: grab('ACCESSORIES') };
}

/* ---------- renderer / scene ---------- */
const canvas = $('scene');
let renderer;
try { renderer = new THREE.WebGLRenderer({canvas, antialias:true}); }
catch(e){ $('err').style.display='flex'; $('loader').classList.add('done'); throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .96;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#f3eee7');
scene.fog = new THREE.Fog('#f3eee7', 34, 60);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 120);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.minDistance = 2; controls.maxDistance = 42;
controls.maxPolarAngle = Math.PI * .47; controls.minPolarAngle = Math.PI * .12;
controls.enablePan = false; controls.rotateSpeed = .6;
controls.autoRotateSpeed = .55;            // 店門口全景時慢慢自動旋轉
let curView = 'front', idleUntil = 0;

const loadingManager = new THREE.LoadingManager();
loadingManager.onProgress = (u, a, b) => { $('bar').style.width = (a / b * 100) + '%'; };
const texLoader = new THREE.TextureLoader(loadingManager);
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function tex(url, cb){ return texLoader.load(url, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso; cb && cb(t); }); }
function canvasTex(w, h, draw, repeat){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso;
  if (repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
function rnd(seed){ let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

const M = {
  white: new THREE.MeshStandardMaterial({color: '#fbf8f3', roughness: .4, envMapIntensity: .6}),
  facade: new THREE.MeshStandardMaterial({color: '#efe5d6', roughness: .85, envMapIntensity: .35}),
  plinth: new THREE.MeshStandardMaterial({color: '#e2d6c6', roughness: .7}),
  gold: new THREE.MeshStandardMaterial({color: '#d8bb84', roughness: .32, metalness: .55, envMapIntensity: 1.4}),
  goldSoft: new THREE.MeshStandardMaterial({color: '#d6c09c', roughness: .45, metalness: .45, envMapIntensity: 1.2}),
  wood: new THREE.MeshStandardMaterial({color: '#c9a882', roughness: .6}),
  glass: new THREE.MeshPhysicalMaterial({color: '#fffaf2', roughness: .04, metalness: 0, transparent: true, opacity: .16, envMapIntensity: 1.6, clearcoat: 1}),
  leaf: new THREE.MeshStandardMaterial({color: '#7f9478', roughness: .85}),
  leafDark: new THREE.MeshStandardMaterial({color: '#647a60', roughness: .85}),
  pearl: new THREE.MeshPhysicalMaterial({color: '#fbf6ee', roughness: .22, clearcoat: 1, clearcoatRoughness: .15, sheen: 1, sheenColor: new THREE.Color('#ffe9d0'), envMapIntensity: 1.2}),
  bulb: new THREE.MeshStandardMaterial({color: '#fff3dc', emissive: '#ffe2b0', emissiveIntensity: 1.8}),
};
const room = new THREE.Group(); scene.add(room);   // 聖誕樹函式會加到這裡
function add(geo, mat, x, y, z, parent = room, {cast = true, receive = true} = {}){
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = receive; parent.add(m); return m;
}

/* ---------- 燈光 ---------- */
scene.add(new THREE.HemisphereLight('#fff8ee', '#cdbfa9', .8));
const sun = new THREE.DirectionalLight('#fff1dc', 2.6);
sun.position.set(9, 16, 12); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 50});
sun.shadow.bias = -.0004; sun.shadow.normalBias = .03;
scene.add(sun);

/* ---------- 地面：圓形石板廣場＋霧綠草地 ---------- */
const PY = .36;
const stoneTex = canvasTex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#e4d8c7'; g.fillRect(0, 0, w, h);
  const r = rnd(7), s = 64;
  for (let y = 0; y < h; y += s) for (let x = 0; x < w; x += s){
    const off = (y / s) % 2 ? s / 2 : 0;
    const v = 226 + r() * 14; g.fillStyle = `rgb(${v},${v - 9},${v - 22})`;
    g.fillRect(x + off + 1.5, y + 1.5, s - 3, s - 3);
  }
  g.strokeStyle = 'rgba(200,180,150,.35)'; g.lineWidth = 1.5;
  for (let y = 0; y <= h; y += s){ g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
}, [3, 3]);
const base = add(new THREE.CylinderGeometry(11, 11.3, PY, 96), new THREE.MeshStandardMaterial({color: '#dccdb8', roughness: .8}), 0, PY / 2, 0, room, {cast: false});
const lawn = add(new THREE.CircleGeometry(11, 96), new THREE.MeshStandardMaterial({color: '#b9c6a8', roughness: 1}), 0, PY + .002, 0, room, {cast: false});
lawn.rotation.x = -Math.PI / 2;
const plaza = add(new THREE.CircleGeometry(8.2, 96), new THREE.MeshStandardMaterial({map: stoneTex, roughness: .7}), 0, PY + .006, .4, room, {cast: false});
plaza.rotation.x = -Math.PI / 2;
const ring = add(new THREE.TorusGeometry(8.2, .05, 8, 120), M.gold, 0, PY + .01, .4, room, {cast: false}); ring.rotation.x = Math.PI / 2;
const rimTop = add(new THREE.TorusGeometry(11.05, .06, 8, 140), M.goldSoft, 0, PY, 0, room, {cast: false}); rimTop.rotation.x = Math.PI / 2;
// 地毯步道：從門口往前
const runner = add(new THREE.PlaneGeometry(1.5, 4.2), new THREE.MeshStandardMaterial({color: '#e7d3c8', roughness: 1}), 0, PY + .012, 3.6, room, {cast: false});
runner.rotation.x = -Math.PI / 2;
[-1, 1].forEach(d => { const e = add(new THREE.BoxGeometry(.04, .01, 4.2), M.gold, d * .75, PY + .016, 3.6, room, {cast: false}); });

/* ---------- 建築 ---------- */
const BW = 10, BD = 5.4, BH = 4.8, FZ = 1.4;                 // 寬、深、高、正面 z
const bz = FZ - BD / 2;
const shop = new THREE.Group(); room.add(shop);
// 開口：中間拱門、兩側拱形櫥窗
const DOOR = {x: 0, w: 1.5, h: 2.35};                    // 門寬、直線段高度（上面再加半圓）
const WIN = [{x: -3.15, w: 2.5, y0: .78, h: 1.55}, {x: 3.15, w: 2.5, y0: .78, h: 1.55}];
function archPath(path, x, w, y0, h, hole){
  const r = w / 2;
  path.moveTo(x - r, y0); path.lineTo(x - r, y0 + h); path.absarc(x, y0 + h, r, Math.PI, 0, true); path.lineTo(x + r, y0); path.lineTo(x - r, y0);
}
const front = new THREE.Shape();
front.moveTo(-BW / 2, 0); front.lineTo(BW / 2, 0); front.lineTo(BW / 2, BH); front.lineTo(-BW / 2, BH); front.lineTo(-BW / 2, 0);
const doorHole = new THREE.Path(); archPath(doorHole, DOOR.x, DOOR.w, .02, DOOR.h); front.holes.push(doorHole);
WIN.forEach(o => { const p = new THREE.Path(); archPath(p, o.x, o.w, o.y0, o.h); front.holes.push(p); });
const frontMesh = add(new THREE.ExtrudeGeometry(front, {depth: .3, bevelEnabled: false, curveSegments: 40}), M.facade, 0, PY, FZ - .3, shop);
// 側牆、背牆、屋頂
add(new THREE.BoxGeometry(.3, BH, BD), M.facade, -BW / 2 + .15, PY + BH / 2, bz, shop);
add(new THREE.BoxGeometry(.3, BH, BD), M.facade, BW / 2 - .15, PY + BH / 2, bz, shop);
add(new THREE.BoxGeometry(BW, BH, .3), M.facade, 0, PY + BH / 2, FZ - BD + .15, shop);
add(new THREE.BoxGeometry(BW + .5, .22, BD + .5), M.white, 0, PY + BH + .11, bz, shop);
// 牆腳石材、上緣線板、金色腰線
add(new THREE.BoxGeometry(BW + .14, .34, BD + .14), M.plinth, 0, PY + .17, bz, shop);
add(new THREE.BoxGeometry(BW + .4, .14, .5), M.white, 0, PY + BH - .1, FZ + .02, shop);
add(new THREE.BoxGeometry(BW + .44, .03, .52), M.gold, 0, PY + BH - .19, FZ + .02, shop);
add(new THREE.BoxGeometry(BW + .02, .025, .04), M.gold, 0, PY + .36, FZ + .01, shop);
// 女兒牆欄杆

function archFrame(x, w, y0, h, z, t = .05){
  const r = w / 2, pts = [new THREE.Vector3(x - r, y0, z)];
  for (let i = 0; i <= 40; i++){ const a = Math.PI - Math.PI * i / 40; pts.push(new THREE.Vector3(x + Math.cos(a) * r, y0 + h + Math.sin(a) * r, z)); }
  pts.push(new THREE.Vector3(x + r, y0, z));
  return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0), 160, t, 8, false), M.gold);
}

  obj.getWorldPosition(tmpV);
  const tgt = tmpV.clone(), pos = tmpV.clone().add(new THREE.Vector3(0, .1, 3.1));
  if (innerWidth > 640){ pos.x += .75; tgt.x += .75; } else { pos.z += .6; pos.y += .45; tgt.y -= .35; }
  flyTo(pos.toArray(), tgt.toArray(), 1.1);
  document.querySelectorAll('.nav button[data-view]').forEach(b => b.setAttribute('aria-pressed', 'false'));
  curView = 'work';
}
function closePanel(){ $('panel').classList.remove('open'); $('panel').setAttribute('aria-hidden', 'true'); document.body.classList.remove('panel-open'); }
$('close').addEventListener('click', closePanel);
$('p-img').addEventListener('click', () => $('lightbox').classList.add('on'));
$('lightbox').addEventListener('click', () => $('lightbox').classList.remove('on'));
addEventListener('keydown', e => { if (e.key === 'Escape'){ if ($('lightbox').classList.contains('on')) $('lightbox').classList.remove('on'); else closePanel(); } });
canvas.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') canvas.classList.toggle('hover', !!hit(e)); });
let hintTimer = setTimeout(hideHint, 7000);
function hideHint(){ $('hint').classList.add('off'); clearTimeout(hintTimer); }
controls.addEventListener('start', () => { tween = null; idleUntil = Infinity; });
controls.addEventListener('end', () => { idleUntil = performance.now() + 5000; });

/* ---------- 啟動 ---------- */
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w < 640 ? 58 : 40; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const [sPos, sTgt] = fit(views.front), start = {pos: sPos, target: sTgt};
camera.position.set(start.pos[0] + 4, start.pos[1] + 4, start.pos[2] + 6);
controls.target.set(...start.target);
let worksReady = false;
loadWorks().then(({nails, acc}) => {
  const pick = [nails[nails.length - 1], nails[nails.length - 2], acc[acc.length - 1], acc[acc.length - 2]];
  pick.forEach((w, i) => easels[i] && easelWork(easels[i], w, i < 2 ? 'nails' : 'accessories'));
  worksReady = true;
}).catch(err => { console.error(err); worksReady = true; });
loadingManager.onLoad = () => {
  if (!worksReady) return;
  setTimeout(() => { $('loader').classList.add('done'); flyTo(start.pos, start.target, 2.2); }, 250);
};
setTimeout(() => { if (!$('loader').classList.contains('done')){ $('loader').classList.add('done'); flyTo(start.pos, start.target, 2); } }, 9000);

const clock = new THREE.Clock(), _tc = new THREE.Color(), tagPos = new THREE.Vector3();
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  if (tween){
    const k = Math.min((performance.now() - tween.s) / tween.d, 1), e = ease(k);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (k >= 1) tween = null;
  }
  if (!reduce){
    sparks.rotation.y = t * .01;
    sparks.material.opacity = .55 + Math.sin(t * 1.6) * .15;
    const TL = tree.userData.lights, HC = tree.userData.halos.geometry.attributes.color;
    treeLights.forEach((o, i) => {
      const k = Math.pow(.5 + .5 * Math.sin(t * o.sp * 1.6 + o.ph), 3);
      TL.setColorAt(i, _tc.copy(TL.userData.base).multiplyScalar(.7 + k * 1.6));
      HC.setXYZ(i, .25 + k * 1.0, .2 + k * .82, .12 + k * .55);
    });
    TL.instanceColor.needsUpdate = true; HC.needsUpdate = true;
    tree.userData.star.rotation.y = Math.sin(t * .6) * .35;
    tree.userData.starGlow.material.opacity = .55 + .35 * Math.sin(t * 2.2);
  }
  // 在正面左右來回慢慢擺動（不轉到店的背面）
  const az = controls.getAzimuthalAngle();
  if (az > .53 + .8) controls.autoRotateSpeed = Math.abs(controls.autoRotateSpeed);
  else if (az < .53 - .8) controls.autoRotateSpeed = -Math.abs(controls.autoRotateSpeed);
  controls.autoRotate = !reduce && curView === 'front' && !tween && !entering && performance.now() > idleUntil && $('loader').classList.contains('done') && !document.body.classList.contains('panel-open');
  controls.update();
  // 店門標籤跟著門走
  tagPos.set(0, PY + BH + .95, FZ).project(camera);
  const tag = $('doortag');
  if (!entering && $('loader').classList.contains('done') && tagPos.z < 1){
    tag.classList.remove('off');
    tag.style.left = ((tagPos.x + 1) / 2 * innerWidth) + 'px';
    tag.style.top = ((1 - tagPos.y) / 2 * innerHeight) + 'px';
  }
  renderer.render(scene, camera);
});
</script>
</body>
